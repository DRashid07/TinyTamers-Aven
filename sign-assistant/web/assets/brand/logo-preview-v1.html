<!doctype html>
<!-- Owner: Codex (Brand/logo assets). -->
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AzSL Assistant — Loqo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(24px, 6vw, 80px); font-family: system-ui, sans-serif; color: #241432; background: #f5f2f8; }
    main { max-width: 1080px; margin: auto; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0 0 28px; line-height: 1.6; color: #5e5268; }
    figure { margin: 0 0 24px; border: 1px solid #e7dfee; border-radius: 24px; overflow: hidden; }
    .surface { min-height: 220px; padding: clamp(16px, 5vw, 60px); display: flex; align-items: center; justify-content: center; background: #fff; }
    .soft .surface { background: #f0e9f7; }
    img { display: block; width: min(100%, 780px); height: auto; }
    figcaption { padding: 14px 24px; font-size: 13px; border-top: 1px solid #e7dfee; background: #fff; }
    a { color: #65269e; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>AzSL Assistant</h1>
    <p>Jest və ünsiyyət ideyasını birləşdirən loqo.</p>
    <figure>
      <div class="surface"><img src="azsl-assistant-logo-v1.png" alt="AzSL Assistant: bənövşəyi jest və danışıq balonu simvolu" width="1983" height="793"></div>
      <figcaption>Ağ fonda</figcaption>
    </figure>
    <figure class="soft">
      <div class="surface"><img src="azsl-assistant-logo-v1.png" alt="AzSL Assistant loqosu açıq bənövşəyi fonda" width="1983" height="793"></div>
      <figcaption>Açıq bənövşəyi fonda</figcaption>
    </figure>
    <p><a href="azsl-assistant-logo-v1.png" download>Şəffaf PNG-ni yüklə</a></p>
  </main>
</body>
</html>
