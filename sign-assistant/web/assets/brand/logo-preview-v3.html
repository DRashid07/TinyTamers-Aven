<!doctype html>
<!-- Owner: Codex (Brand/logo assets). -->
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AzSL — Yenilənmiş yazısız loqo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: clamp(24px, 6vw, 72px); background: #f4f1f7; color: #241432; font-family: system-ui, sans-serif; }
    main { max-width: 1040px; margin: auto; }
    .stage { display: grid; place-items: center; min-height: 460px; padding: 32px; background: #fff; border: 1px solid #e5ddec; border-radius: 24px; }
    .stage img { display: block; width: min(100%, 420px); height: auto; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 24px; }
    figure { margin: 0; padding: 24px; border-radius: 20px; background: #fff; }
    figure img { width: 100%; max-width: 260px; height: auto; display: block; margin: auto; }
    figcaption { font-size: 13px; text-align: center; margin-top: 16px; color: #5e5268; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin-top: 24px; font-size: 14px; }
    a { color: #60269e; text-underline-offset: 4px; }
    @media (max-width: 480px) { .stage { min-height: 320px; padding: 20px; } .comparison { gap: 12px; } figure { padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <img src="azsl-assistant-symbol-v3.png" alt="Yenilənmiş yazısız AzSL loqosu" width="1254" height="1254">
    </div>
    <div class="comparison">
      <figure><img src="azsl-assistant-symbol-v2.png" alt="Əvvəlki sadə bənövşəyi variant" width="1254" height="1254"><figcaption>Əvvəlki variant</figcaption></figure>
      <figure><img src="azsl-assistant-symbol-v3.png" alt="Yeni sadə bənövşəyi variant" width="1254" height="1254"><figcaption>Yenilənmiş variant</figcaption></figure>
    </div>
    <nav aria-label="Loqo faylları">
      <a href="azsl-assistant-symbol-v3.png" download>Yeni PNG-ni yüklə</a>
      <a href="logo-similarity-research-v3.md">Oxşarlıq araşdırması</a>
    </nav>
  </main>
</body>
</html>
